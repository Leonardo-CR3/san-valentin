<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>para ti karla con mucho amor  sjjsjs te amoo </title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #C5A3FF, #C5A3FF);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Carta */
.carta {
    width: 200px;
    height: 150px;
    background: white;
    position: relative;
    cursor: pointer;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.5s;
}

.carta:hover {
    transform: scale(1.1);
}

.carta::before {
    content: "💌";
    font-size: 50px;
}

/* Mensaje oculto */
.mensaje {
    position: absolute;
    width: 80%;
    max-width: 400px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.mensaje h2 {
    color: #b30000;
}

/* Corazones y girasoles */
.corazon {
    position: absolute;
    font-size: 25px;
    animation: flotar linear infinite;
    opacity: 0.8;
}

@keyframes flotar {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
}
</style>
</head>

<body>

<div class="carta" onclick="abrirCarta()"></div>

<div class="mensaje" id="mensaje">
    <h2>Feliz primer mes corazón 💘</h2>
    <p>
        ¨Hay muchos momentos hermosos en la vida pero sin duda el mejor de ellos, fue cuando te conocí. te amo mucho  🌻💘
    </p>
</div>

<script>
function abrirCarta() {
    document.querySelector(".carta").style.display = "none";
    document.getElementById("mensaje").style.display = "block";
}

// corazones y girasoles
function crearElemento() {
    const elemento = document.createElement("div");
    elemento.classList.add("corazon");

    const figuras = ["💖", "🌻"];
    elemento.innerHTML = figuras[Math.floor(Math.random() * figuras.length)];

    elemento.style.left = Math.random() * 100 + "vw";
    elemento.style.animationDuration = (Math.random() * 3 + 3) + "s";

    document.body.appendChild(elemento);

    setTimeout(() => {
        elemento.remove();
    }, 6000);
}

setInterval(crearElemento, 300);
</script>

</body>
</html>
