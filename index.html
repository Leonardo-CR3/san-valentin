            font-family: 'Segoe UI', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Brillo del fondo */
        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            filter: blur(80px);
            animation: brillo 5s infinite alternate;
        }

        @keyframes brillo {
            from {
                transform: scale(0.8);
                opacity: 0.4;
            }
            to {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .contenedor {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 45px 30px;
            width: 90%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.35);

            border-radius: 30px;
            border: 2px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 50px rgba(150, 100, 0, 0.2);
            animation: aparecer 1.5s ease;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

                opacity: 1;
